<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SEOquake 2026 new features overview</title>
<desc id="desc">A browser style dashboard showing Quick View, Full Report, page audit checks, links, schema, keyword density, SEObar, exports and Semrush metrics.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#eef9fa"/><stop offset="1" stop-color="#fff7ee"/></linearGradient><filter id="s" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#0b2545" flood-opacity=".13"/></filter></defs>
<rect width="1600" height="900" rx="34" fill="url(#bg)"/>
<text x="80" y="92" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#0b2545">What the rebuilt SEOquake focuses on</text>
<text x="80" y="140" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#5f7186">Fast page checks first, deeper reports when you need them.</text>
<g filter="url(#s)">
<rect x="90" y="200" width="1420" height="610" rx="30" fill="#fff" stroke="#dfe7ee"/>
<rect x="90" y="200" width="1420" height="72" rx="30" fill="#0b2545"/>
<circle cx="130" cy="236" r="8" fill="#ff6a3d"/><circle cx="156" cy="236" r="8" fill="#e8c547"/><circle cx="182" cy="236" r="8" fill="#20c5d8"/>
<text x="230" y="246" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#fff">SEOquake</text>
<rect x="355" y="217" width="160" height="38" rx="19" fill="#20c5d8"/><text x="393" y="243" font-family="Arial" font-size="18" font-weight="700" fill="#0b2545">Quick View</text>
<rect x="530" y="217" width="160" height="38" rx="19" fill="#fff" opacity=".12"/><text x="571" y="243" font-family="Arial" font-size="18" font-weight="700" fill="#fff">Full Report</text>

<rect x="130" y="315" width="300" height="445" rx="22" fill="#f6f9fc"/>
<text x="165" y="360" font-family="Arial" font-size="23" font-weight="700" fill="#0b2545">Quick page snapshot</text>
<g font-family="Arial" font-size="20" fill="#294761"><text x="165" y="410">Page Info</text><text x="165" y="458">Content</text><text x="165" y="506">Audit</text><text x="165" y="554">Schema</text><text x="165" y="602">Semrush</text></g>
<g fill="#008fa1"><circle cx="148" cy="403" r="6"/><circle cx="148" cy="451" r="6"/><circle cx="148" cy="499" r="6"/><circle cx="148" cy="547" r="6"/><circle cx="148" cy="595" r="6"/></g>
<rect x="165" y="650" width="230" height="72" rx="15" fill="#e8f7f8"/><text x="188" y="681" font-family="Arial" font-size="17" font-weight="700" fill="#006d7c">Best for</text><text x="188" y="707" font-family="Arial" font-size="17" fill="#294761">Fast daily checks</text>

<rect x="470" y="315" width="1000" height="445" rx="22" fill="#ffffff" stroke="#dfe7ee"/>
<text x="510" y="360" font-family="Arial" font-size="23" font-weight="700" fill="#0b2545">Full Report</text>
<g>
  <rect x="510" y="400" width="270" height="130" rx="18" fill="#eef8f3"/><text x="540" y="438" font-family="Arial" font-size="19" font-weight="700" fill="#168663">28 page checks</text><text x="540" y="474" font-family="Arial" font-size="17" fill="#294761">Titles, headings, ALT,</text><text x="540" y="501" font-family="Arial" font-size="17" fill="#294761">canonicals, robots, mobile</text>
  <rect x="800" y="400" width="270" height="130" rx="18" fill="#fff4ed"/><text x="830" y="438" font-family="Arial" font-size="19" font-weight="700" fill="#b25024">Links</text><text x="830" y="474" font-family="Arial" font-size="17" fill="#294761">Internal, external, anchor</text><text x="830" y="501" font-family="Arial" font-size="17" fill="#294761">text, status and rel values</text>
  <rect x="1090" y="400" width="340" height="130" rx="18" fill="#eef6ff"/><text x="1120" y="438" font-family="Arial" font-size="19" font-weight="700" fill="#0b5aa6">Schema</text><text x="1120" y="474" font-family="Arial" font-size="17" fill="#294761">Structured data types and</text><text x="1120" y="501" font-family="Arial" font-size="17" fill="#294761">implementation details</text>
  <rect x="510" y="550" width="270" height="130" rx="18" fill="#f8f1ff"/><text x="540" y="588" font-family="Arial" font-size="19" font-weight="700" fill="#6b3ca8">Keyword density</text><text x="540" y="624" font-family="Arial" font-size="17" fill="#294761">1 to 4 word phrases and</text><text x="540" y="651" font-family="Arial" font-size="17" fill="#294761">placement signals</text>
  <rect x="800" y="550" width="270" height="130" rx="18" fill="#eaf8fa"/><text x="830" y="588" font-family="Arial" font-size="19" font-weight="700" fill="#007e91">SEObar</text><text x="830" y="624" font-family="Arial" font-size="17" fill="#294761">Selected metrics while</text><text x="830" y="651" font-family="Arial" font-size="17" fill="#294761">you browse</text>
  <rect x="1090" y="550" width="340" height="130" rx="18" fill="#fff8e9"/><text x="1120" y="588" font-family="Arial" font-size="19" font-weight="700" fill="#a96418">Exports and Semrush data</text><text x="1120" y="624" font-family="Arial" font-size="17" fill="#294761">CSV, PDF, traffic estimates</text><text x="1120" y="651" font-family="Arial" font-size="17" fill="#294761">and backlink metrics</text>
</g>
</g>
<text x="80" y="855" font-family="Arial" font-size="19" fill="#5f7186">Think of Quick View as the fast check, and Full Report as the investigation layer.</text>
</svg>