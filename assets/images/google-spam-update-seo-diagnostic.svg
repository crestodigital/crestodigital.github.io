<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="780" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">SEO diagnostic flow after a Google spam update</title><desc id="desc">Flowchart showing how to compare Search Console dates, identify affected page groups, review spam-policy risks, improve low-value pages, and monitor recovery.</desc><rect width="1400" height="780" rx="38" fill="#071B34"/><text x="75" y="95" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800" fill="#fff">Traffic dropped after a spam update?</text><text x="75" y="140" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#B8C7D8">Use evidence before changing the whole site.</text><g font-family="Arial,Helvetica,sans-serif" transform="translate(80 210)"><g><rect width="230" height="155" rx="24" fill="#fff"/><text x="28" y="46" font-size="19" font-weight="800" fill="#20C5DB">STEP 1</text><text x="28" y="83" font-size="25" font-weight="800" fill="#0B2545">Compare dates</text><text x="28" y="116" font-size="19" fill="#526A82">GSC before vs after</text><text x="28" y="142" font-size="19" fill="#526A82">the rollout window</text></g><path d="M245 78h72" stroke="#20C5DB" stroke-width="7" stroke-linecap="round"/><path d="M303 65l17 13-17 13" fill="none" stroke="#20C5DB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(330)"><rect width="230" height="155" rx="24" fill="#fff"/><text x="28" y="46" font-size="19" font-weight="800" fill="#20C5DB">STEP 2</text><text x="28" y="83" font-size="25" font-weight="800" fill="#0B2545">Segment losses</text><text x="28" y="116" font-size="19" fill="#526A82">Pages, queries,</text><text x="28" y="142" font-size="19" fill="#526A82">countries and intent</text></g><path d="M575 78h72" stroke="#20C5DB" stroke-width="7" stroke-linecap="round"/><path d="M633 65l17 13-17 13" fill="none" stroke="#20C5DB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(660)"><rect width="230" height="155" rx="24" fill="#fff"/><text x="28" y="46" font-size="19" font-weight="800" fill="#FF6A3D">STEP 3</text><text x="28" y="83" font-size="25" font-weight="800" fill="#0B2545">Check policies</text><text x="28" y="116" font-size="19" fill="#526A82">Scaled content, links,</text><text x="28" y="142" font-size="19" fill="#526A82">doorways, reputation</text></g><path d="M905 78h72" stroke="#20C5DB" stroke-width="7" stroke-linecap="round"/><path d="M963 65l17 13-17 13" fill="none" stroke="#20C5DB" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(990)"><rect width="230" height="155" rx="24" fill="#fff"/><text x="28" y="46" font-size="19" font-weight="800" fill="#0DAD93">STEP 4</text><text x="28" y="83" font-size="25" font-weight="800" fill="#0B2545">Improve deeply</text><text x="28" y="116" font-size="19" fill="#526A82">Remove, consolidate</text><text x="28" y="142" font-size="19" fill="#526A82">or add real value</text></g><path d="M1105 175v92H235v80" fill="none" stroke="#6D7CFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path d="M222 332l13 18 13-18" fill="none" stroke="#6D7CFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(80 360)"><rect width="1140" height="165" rx="28" fill="#102D50" stroke="#284A70" stroke-width="2"/><text x="38" y="48" font-size="21" font-weight="800" fill="#8B98FF">STEP 5 • MONITOR RECOVERY</text><text x="38" y="92" font-size="28" font-weight="800" fill="#fff">Track indexing, impressions, query mix and page-group recovery over time.</text><text x="38" y="132" font-size="21" fill="#B8C7D8">Do not expect an instant rebound. Google says automated spam systems can take time to reassess compliance.</text></g></g><rect x="80" y="690" width="1240" height="48" rx="15" fill="#EAF9F7"/><text x="105" y="722" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#0B6C61">Key rule: diagnose the affected pattern first. Do not rewrite every page just because rankings moved.</text></svg>