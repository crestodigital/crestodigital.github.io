<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc"><title id="title">2026 Google Search update timeline</title><desc id="desc">Timeline showing the February Discover core update, March spam and core updates, May core update, June spam update and August spam update.</desc><rect width="1400" height="760" rx="38" fill="#F5F7FA"/><text x="78" y="92" font-family="Arial,Helvetica,sans-serif" font-size="46" font-weight="800" fill="#0B2545">Confirmed Google Search updates in 2026</text><text x="78" y="136" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#65758A">Major announced rollouts through August 21, 2026</text><line x1="145" y1="375" x2="1255" y2="375" stroke="#B8C7D8" stroke-width="8" stroke-linecap="round"/><g font-family="Arial,Helvetica,sans-serif"><g transform="translate(165 375)"><circle r="28" fill="#20C5DB"/><line y1="-28" y2="-130" stroke="#20C5DB" stroke-width="5"/><text x="-70" y="-160" fill="#0B2545" font-size="23" font-weight="800">FEB 5–27</text><text x="-84" y="-128" fill="#42566F" font-size="20">Discover Core</text></g><g transform="translate(355 375)"><circle r="28" fill="#FF6A3D"/><line y1="28" y2="130" stroke="#FF6A3D" stroke-width="5"/><text x="-72" y="170" fill="#0B2545" font-size="23" font-weight="800">MAR 24–25</text><text x="-65" y="202" fill="#42566F" font-size="20">Spam Update</text></g><g transform="translate(535 375)"><circle r="28" fill="#6D7CFF"/><line y1="-28" y2="-130" stroke="#6D7CFF" stroke-width="5"/><text x="-76" y="-160" fill="#0B2545" font-size="23" font-weight="800">MAR 27–APR 8</text><text x="-60" y="-128" fill="#42566F" font-size="20">Core Update</text></g><g transform="translate(750 375)"><circle r="28" fill="#6D7CFF"/><line y1="28" y2="130" stroke="#6D7CFF" stroke-width="5"/><text x="-70" y="170" fill="#0B2545" font-size="23" font-weight="800">MAY 21–JUN 2</text><text x="-60" y="202" fill="#42566F" font-size="20">Core Update</text></g><g transform="translate(970 375)"><circle r="28" fill="#FF6A3D"/><line y1="-28" y2="-130" stroke="#FF6A3D" stroke-width="5"/><text x="-72" y="-160" fill="#0B2545" font-size="23" font-weight="800">JUN 24–26</text><text x="-65" y="-128" fill="#42566F" font-size="20">Spam Update</text></g><g transform="translate(1205 375)"><circle r="35" fill="#0DAD93"/><circle r="15" fill="#fff"/><line y1="28" y2="130" stroke="#0DAD93" stroke-width="6"/><text x="-88" y="170" fill="#0B2545" font-size="23" font-weight="800">AUG 18–21</text><text x="-78" y="202" fill="#0DAD93" font-size="20" font-weight="800">Spam Update</text><text x="-88" y="232" fill="#42566F" font-size="18">Latest confirmed</text></g></g><rect x="78" y="650" width="1244" height="58" rx="18" fill="#EAF9F7"/><text x="105" y="688" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#0B6C61">Spam updates improve Google's automated spam systems; core updates broadly reassess ranking systems.</text></svg>