<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">SEOquake 2026 rebuild and alternatives</title>
  <desc id="desc">A browser SEO workflow illustration comparing the rebuilt SEOquake with alternative SEO extensions.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7ee"/>
      <stop offset="1" stop-color="#eef9fb"/>
    </linearGradient>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a31"/>
      <stop offset="1" stop-color="#0b2545"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#0b2545" flood-opacity=".15"/>
    </filter>
  </defs>
  <rect width="1600" height="900" rx="42" fill="url(#bg)"/>
  <circle cx="1450" cy="110" r="210" fill="#20c5d8" opacity=".11"/>
  <circle cx="120" cy="780" r="190" fill="#e88039" opacity=".10"/>

  <g transform="translate(92 94)">
    <rect x="0" y="0" width="310" height="48" rx="24" fill="#e7f7f8"/>
    <circle cx="26" cy="24" r="7" fill="#e88039"/>
    <text x="46" y="31" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#0b2545">SEO extension update · 2026</text>
    <text x="0" y="126" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0b2545">SEOquake changed.</text>
    <text x="0" y="192" font-family="Arial, Helvetica, sans-serif" font-size="64" font-weight="800" fill="#0b2545">What replaces the old workflow?</text>
    <text x="0" y="246" font-family="Arial, Helvetica, sans-serif" font-size="26" fill="#5f7186">New features, missing tools and the strongest alternatives.</text>
  </g>

  <g transform="translate(96 408)" filter="url(#shadow)">
    <rect width="600" height="340" rx="30" fill="#ffffff"/>
    <rect width="600" height="64" rx="30" fill="#f4f7f9"/>
    <rect y="38" width="600" height="26" fill="#f4f7f9"/>
    <circle cx="34" cy="31" r="8" fill="#ff6a3d"/><circle cx="60" cy="31" r="8" fill="#e8a52f"/><circle cx="86" cy="31" r="8" fill="#20c5d8"/>
    <text x="122" y="39" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0b2545">Rebuilt SEOquake</text>
    <rect x="28" y="94" width="544" height="56" rx="15" fill="#0b2545"/>
    <text x="52" y="130" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Quick View → Full Report</text>
    <g font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#18324b">
      <rect x="28" y="174" width="168" height="56" rx="14" fill="#eef9fb"/><text x="48" y="209">28 SEO checks</text>
      <rect x="216" y="174" width="168" height="56" rx="14" fill="#fff4ec"/><text x="241" y="209">SEObar</text>
      <rect x="404" y="174" width="168" height="56" rx="14" fill="#eef9fb"/><text x="430" y="209">Semrush data</text>
      <rect x="28" y="248" width="168" height="56" rx="14" fill="#fff4ec"/><text x="51" y="283">Links + status</text>
      <rect x="216" y="248" width="168" height="56" rx="14" fill="#eef9fb"/><text x="238" y="283">Schema checks</text>
      <rect x="404" y="248" width="168" height="56" rx="14" fill="#fff4ec"/><text x="427" y="283">PDF / CSV</text>
    </g>
  </g>

  <g transform="translate(760 360)" filter="url(#shadow)">
    <rect width="744" height="430" rx="34" fill="url(#navy)"/>
    <text x="44" y="72" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#8ee8ef">WHAT USERS MISS</text>
    <text x="44" y="122" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" fill="#ffffff">Old SEOquake features → alternatives</text>
    <g font-family="Arial, Helvetica, sans-serif">
      <g transform="translate(44 164)"><rect width="656" height="62" rx="16" fill="#ffffff" opacity=".09"/><text x="22" y="39" font-size="21" fill="#ffffff">SERP overlay</text><text x="330" y="39" font-size="21" font-weight="700" fill="#f09848">MozBar / Ahrefs</text></g>
      <g transform="translate(44 240)"><rect width="656" height="62" rx="16" fill="#ffffff" opacity=".09"/><text x="22" y="39" font-size="21" fill="#ffffff">Link highlighting</text><text x="330" y="39" font-size="21" font-weight="700" fill="#f09848">Ahrefs / MozBar</text></g>
      <g transform="translate(44 316)"><rect width="656" height="62" rx="16" fill="#ffffff" opacity=".09"/><text x="22" y="39" font-size="21" fill="#ffffff">Fast page inspection</text><text x="330" y="39" font-size="21" font-weight="700" fill="#f09848">Detailed / META SEO</text></g>
    </g>
  </g>
</svg>
