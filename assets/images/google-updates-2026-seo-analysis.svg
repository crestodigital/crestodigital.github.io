<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="title desc">
<title id="title">SEO analysis after a Google update</title>
<desc id="desc">Illustration of a search performance dashboard with a ranking chart, checklist and magnifying glass.</desc>
<rect width="800" height="600" rx="32" fill="#f5fbfc"/>
<rect x="70" y="75" width="660" height="450" rx="28" fill="#fff" stroke="#dce6ee" stroke-width="3"/>
<text x="115" y="140" fill="#0b2545" font-family="Arial,sans-serif" font-size="35" font-weight="800">SEO Update Analysis</text>
<text x="115" y="176" fill="#5f7186" font-family="Arial,sans-serif" font-size="18">Check data before changing strategy</text>
<rect x="115" y="215" width="390" height="220" rx="18" fill="#071a31"/>
<g stroke="#25496b" stroke-width="2"><path d="M145 260h330M145 310h330M145 360h330M145 410h330"/></g>
<path d="M150 390 L210 345 L270 360 L330 295 L390 315 L465 250" fill="none" stroke="#20c5db" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="465" cy="250" r="10" fill="#ff6a3d"/>
<g transform="translate(545 225)">
  <rect width="145" height="210" rx="18" fill="#eef9f6" stroke="#bfe9df"/>
  <text x="25" y="42" fill="#0b2545" font-family="Arial,sans-serif" font-size="19" font-weight="700">Check</text>
  <g font-family="Arial,sans-serif" font-size="16" fill="#334e68"><text x="48" y="82">Queries</text><text x="48" y="122">Pages</text><text x="48" y="162">Indexing</text></g>
  <g stroke="#0ca678" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M20 73l8 8 14-18"/><path d="M20 113l8 8 14-18"/><path d="M20 153l8 8 14-18"/></g>
</g>
<g transform="translate(450 365)" stroke="#0b2545" fill="none" stroke-width="10"><circle cx="70" cy="70" r="58"/><path d="M113 113l72 72" stroke-linecap="round"/></g>
</svg>