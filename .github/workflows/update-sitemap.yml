name: Update XML sitemap

on:
  push:
    branches:
      - main
    paths:
      - "**/*.html"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-sitemap-main
  cancel-in-progress: true

jobs:
  generate-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate sitemap
        run: node scripts/generate-sitemap.mjs

      - name: Commit sitemap changes
        run: |
          if git diff --quiet -- sitemap.xml; then
            echo "Sitemap is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "Automatically update sitemap"
          git push
